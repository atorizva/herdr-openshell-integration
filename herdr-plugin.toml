id = "herdr-openshell"
name = "herdr-openshell"
version = "1.0.1"
min_herdr_version = "0.9.5"
description = "Report each OpenShell sandbox's agent state in the pane it's connected to."
platforms = ["linux", "macos"]

# Herdr never reaps plugin children, so the hook must return immediately: the
# poller re-spawns itself detached and exits. `node` comes from PATH (cwd is the
# plugin root).
[[startup]]
command = ["node", "poller.js", "--detach"]
